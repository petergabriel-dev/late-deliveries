[project]
name = "late-delivery"
version = "0.1.0"
description = "Causal estimate of what a late delivery costs an e-commerce marketplace (Olist data)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "pyarrow",
    "pyfixest>=0.70.0",
    "rddensity>=3.0",
    "rdrobust>=2.1.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
