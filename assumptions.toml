    "A partir de março de 1992, essa taxa recebeu a denominação de taxa PTAX (fechamento).",
    "Referem-se às médias das taxas diárias do período em referência (mês/ano), calculadas para compra e para venda, ponderadas pelos dias úteis.",
]
verification = "On 2026-11-16 each monthly value below equaled the mean of the daily SGS series 1 values for that month (4 decimals, all 20 months)."
